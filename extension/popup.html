<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Три Слога</title><link rel="stylesheet" href="popup.css"></head>
<body>
<header><span class="mark">ТС</span><div><h1>Три Слога</h1><p>Автоматические публикации VK</p></div></header>
<div class="community">Фото сообщества · песня · цитата</div>
<label for="interval">Публиковать каждые N часов</label>
<input id="interval" type="number" min="0.5" max="8760" step="0.5" value="6">
<p class="hint">После включения первый пост создаётся сразу. Затем — по выбранному интервалу. Chrome должен работать, компьютер — быть включён.</p>
<button id="enable" class="primary">Включить</button>
<button id="disable" class="secondary">Остановить</button>
<p id="status" role="status">Загружаю настройки…</p>
<button id="fixed" class="primary" hidden>Исправлено — повторить</button>
<button id="diagnostics">Скачать диагностику</button>
<script src="popup.js"></script>
</body></html>
